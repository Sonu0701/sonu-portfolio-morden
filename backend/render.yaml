services:
  - type: web
    name: sonu-chatbot-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: MISTRAL_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://sonu-portfolio-omega.vercel.app